<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentDrive - Каталог</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- НАВІГАТОР -->
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">🚘 StudentDrive</a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="catalog.html" style="color: #007bff; font-weight: bold;">Catalog</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="auth-actions">
                <span id="userGreeting" class="user-greeting"></span>
                <button id="navLoginBtn" class="btn btn-outline" onclick="openModal('loginModal')">Увійти</button>
                <button id="navRegisterBtn" class="btn btn-primary" onclick="openModal('registerModal')">Реєстрація</button>
                <button id="navLogoutBtn" class="btn btn-outline" style="display:none;" onclick="logoutUser()">Вийти</button>
            </div>
        </div>
    </header>

    <!-- МОДАЛЬНІ ВІКНА -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal">
            <span class="close-modal" onclick="closeModal('loginModal')">&times;</span>
            <h2>Авторизація</h2>
            <div id="loginAlert" class="alert"></div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group"><label>Email</label><input type="email" id="loginEmail" class="form-control" required></div>
                <div class="form-group"><label>Пароль</label><input type="password" id="loginPassword" class="form-control" required></div>
                <button type="submit" class="btn btn-primary btn-block">Увійти</button>
            </form>
        </div>
    </div>

    <div id="registerModal" class="modal-overlay">
        <div class="modal">
            <span class="close-modal" onclick="closeModal('registerModal')">&times;</span>
            <h2>Реєстрація</h2>
            <div id="registerAlert" class="alert"></div>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group"><label>Ім'я</label><input type="text" id="regName" class="form-control" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="regEmail" class="form-control" required></div>
                <div class="form-group"><label>Пароль</label><input type="password" id="regPassword" class="form-control" required minlength="6"></div>
                <button type="submit" class="btn btn-primary btn-block">Зареєструватися</button>
            </form>
        </div>
    </div>

    <!-- КАТАЛОГ -->
    <main class="container catalog-container">
        <!-- Фільтри -->
        <aside class="sidebar">
            <h3 style="margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px;">Фільтри</h3>
            <div class="filter-group">
                <h4>Тип кузова</h4>
                <label><input type="checkbox" class="filter-cb" value="sedan"> Седан</label>
                <label><input type="checkbox" class="filter-cb" value="hatchback"> Хетчбек</label>
                <label><input type="checkbox" class="filter-cb" value="suv"> SUV</label>
            </div>
            <div class="filter-group">
                <h4>Бюджет</h4>
                <label><input type="checkbox" class="filter-cb" value="under15k"> До $15,000</label>
                <label><input type="checkbox" class="filter-cb" value="over15k"> Більше $15,000</label>
            </div>
            <button class="btn btn-primary btn-block" onclick="applyFilters()">Застосувати</button>
            <button class="btn btn-outline btn-block" onclick="resetFilters()" style="margin-top: 10px;">Скинути</button>
        </aside>

        <!-- Картки -->
        <div class="catalog-content">
            <div class="catalog-header">
                <h2>Автомобілі в наявності</h2>
                <span id="resultsCount" style="color: #666; font-size: 14px;">Завантаження...</span>
            </div>
            
            <!-- Місце для виводу помилок скрипта -->
            <div id="scriptErrorMsg" style="color: red; font-weight: bold; margin-bottom: 15px; display: none;"></div>
            
            <div class="cards-grid" id="carsGrid">
                <!-- Картки з'являться тут -->
            </div>
        </div>
    </main>

    <!-- Підключення скрипта з відстеженням помилок -->
    <script>
        function showScriptError() {
            document.getElementById('resultsCount').style.display = 'none';
            const errorDiv = document.getElementById('scriptErrorMsg');
            errorDiv.style.display = 'block';
            errorDiv.innerHTML = "❌ КРИТИЧНА ПОМИЛКА: Файл 'script.js' не знайдено або він має іншу назву!<br>Перевірте, чи лежить файл script.js в тій самій папці, і чи немає у нього прихованого розширення (наприклад script.js.txt).";
        }
    </script>
    <script src="script.js" onerror="showScriptError()"></script>

</body>
</html>
