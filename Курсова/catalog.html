<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokyoDrive - Гараж</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">東京 <span>TokyoDrive</span></a>
            <nav class="nav-links">
                <a href="index.html">Головна</a>
                <a href="catalog.html" style="color: #BC002D; font-weight: bold;">Каталог JDM</a>
                <a href="contact.html">Контакти</a>
            </nav>
            <div class="auth-actions">
                <span id="userGreeting" class="user-greeting"></span>
                <button id="navLoginBtn" class="btn btn-outline" onclick="openModal('loginModal')">Увійти</button>
                <button id="navRegisterBtn" class="btn btn-primary" onclick="openModal('registerModal')">Реєстрація</button>
                <button id="navLogoutBtn" class="btn btn-outline" style="display:none;" onclick="logoutUser()">Вийти</button>
            </div>
        </div>
    </header>

    <div id="loginModal" class="modal-overlay">
        <div class="modal">
            <span class="close-modal" onclick="closeModal('loginModal')">&times;</span>
            <h2>Авторизація</h2>
            <div id="loginAlert" class="alert"></div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group"><label>Email</label><input type="email" id="loginEmail" class="form-control" required></div>
                <div class="form-group"><label>Пароль</label><input type="password" id="loginPassword" class="form-control" required></div>
                <button type="submit" class="btn btn-primary btn-block">Увійти</button>
            </form>
        </div>
    </div>

    <div id="registerModal" class="modal-overlay">
        <div class="modal">
            <span class="close-modal" onclick="closeModal('registerModal')">&times;</span>
            <h2>Новий Клієнт</h2>
            <div id="registerAlert" class="alert"></div>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group"><label>Ім'я</label><input type="text" id="regName" class="form-control" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="regEmail" class="form-control" required></div>
                <div class="form-group"><label>Пароль</label><input type="password" id="regPassword" class="form-control" required minlength="6"></div>
                <button type="submit" class="btn btn-primary btn-block">Зареєструватися</button>
            </form>
        </div>
    </div>

    <main class="container catalog-container">
        <aside class="sidebar">
            <h3 style="margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; color: #BC002D; text-transform: uppercase;">Фільтри</h3>
            <div class="filter-group">
                <h4>Кузов</h4>
                <label><input type="checkbox" class="filter-cb" value="coupe"> Купе</label>
                <label><input type="checkbox" class="filter-cb" value="sedan"> Седан</label>
                <label><input type="checkbox" class="filter-cb" value="hatchback"> Хетчбек</label>
            </div>
            <div class="filter-group">
                <h4>Епоха</h4>
                <label><input type="checkbox" class="filter-cb" value="90s"> Класика 90-х</label>
                <label><input type="checkbox" class="filter-cb" value="modern"> Сучасні (2000+)</label>
            </div>
            <button class="btn btn-primary btn-block" onclick="applyFilters()">Застосувати</button>
            <button class="btn btn-outline btn-block" onclick="resetFilters()" style="margin-top: 10px;">Скинути</button>
        </aside>

        <div class="catalog-content">
            <div class="catalog-header">
                <h2>Наш Гараж</h2>
                <span id="resultsCount" style="color: #BC002D; font-size: 14px; font-weight: bold;">Завантаження...</span>
            </div>
            <div class="cards-grid" id="carsGrid"></div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom" style="border-top: none;">
                <p>© 2026 TokyoDrive Importers. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
